<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wutonghui-xiaobei</title>
  <style>
    /* === 暗色主题 === */
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent: #ea580c;
      --accent-hover: #f97316;
      --success: #22c55e;
      --border: #475569;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
    }

    /* === Header === */
    header {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      background: var(--accent);
      color: white;
      font-weight: 500;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
      font-family: 'SF Mono', Menlo, monospace;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-secondary);
      transition: background 0.3s;
    }
    .status-dot.ready { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .status-dot.error { background: #ef4444; }

    /* === Main === */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 24px;
      overflow: hidden;
    }
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 14px;
    }
    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--bg-secondary);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }
    .msg-meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 4px;
      opacity: 0.7;
    }
    .msg-content { white-space: pre-wrap; }

    .quick-prompts {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 0;
    }
    .quick-btn {
      padding: 6px 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .quick-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* === Input === */
    .input-area {
      display: flex;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .input-area textarea {
      flex: 1;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      min-height: 50px;
      max-height: 150px;
    }
    .input-area textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .send-btn {
      padding: 0 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: white;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>
      🪷 wutonghui-xiaobei
      <span class="badge">v2.0 Local-First</span>
    </h1>
    <div class="status-pill">
      <div class="status-dot" id="daemon-dot"></div>
      <span id="daemon-status">daemon: 未启动</span>
    </div>
  </header>

  <main>
    <div class="chat-area" id="chat">
      <div class="msg assistant">
        <div class="msg-meta">吴桐荟 · v2.0</div>
        <div class="msg-content">你好！我是 wutonghui-xiaobei 桌面版。
与 xiaobei 不同，桌面版不需要微信扫码绑定 OpenClaw daemon——直接在这聊天即可。

试试说："给美甲店写 3 篇小红书" 或 "看一下最近 AI 客服赛道的讨论"。</div>
      </div>
    </div>

    <div class="quick-prompts">
      <button class="quick-btn" onclick="quickPrompt('给美甲店写 3 篇小红书')">📝 写小红书</button>
      <button class="quick-btn" onclick="quickPrompt('找 50 个本地服务潜客')">🎯 找潜客</button>
      <button class="quick-btn" onclick="quickPrompt('调研 AI 客服赛道')">🔍 调研</button>
      <button class="quick-btn" onclick="quickPrompt('做一份融资 PPT')">📊 融资 PPT</button>
    </div>

    <div class="input-area">
      <textarea id="input" placeholder="说点什么…  Enter 发送，Shift+Enter 换行"></textarea>
      <button class="send-btn" id="send" onclick="send()">发送</button>
    </div>
  </main>

  <script>
    // === 应用状态 ===
    const app = {
      daemonReady: false,
    };

    const dot = document.getElementById('daemon-dot');
    const statusText = document.getElementById('daemon-status');

    // 监听 daemon 状态
    if (window.wutonghui) {
      window.wutonghui.onDaemonStatus((data) => {
        app.daemonReady = data.ready;
        if (data.ready) {
          dot.className = 'status-dot ready';
          statusText.textContent = `daemon: 运行中 (${Math.floor(data.uptime / 1000)}s)`;
        } else {
          dot.className = 'status-dot';
          statusText.textContent = 'daemon: 启动中…';
        }
      });

      window.wutonghui.onDaemonExit((data) => {
        dot.className = 'status-dot error';
        statusText.textContent = `daemon: 已退出 (code=${data.code})`;
      });

      // 初始化状态
      window.wutonghui.status().then((s) => {
        app.daemonReady = s.daemonReady;
        if (s.daemonReady) {
          dot.className = 'status-dot ready';
          statusText.textContent = `daemon: 运行中 (:${s.daemonPort})`;
        }
      });
    }

    // === 聊天 ===
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function nowStr() {
      return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    function append(role, content) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerHTML = `
        <div class="msg-meta">${role === 'user' ? '你' : '吴桐荟'} · ${nowStr()}</div>
        <div class="msg-content"></div>
      `;
      div.querySelector('.msg-content').textContent = content;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      append('user', text);
      input.value = '';

      // 调 daemon /chat API（M1 阶段：实接）
      if (!app.daemonReady) {
        append('assistant', '⚠️ daemon 未就绪，请先跑 bash scripts/install.sh 装 OpenClaw daemon。');
        return;
      }

      // 显示"处理中"指示
      const loadingId = 'loading-' + Date.now();
      const loadingDiv = document.createElement('div');
      loadingDiv.id = loadingId;
      loadingDiv.className = 'msg assistant';
      loadingDiv.innerHTML = '<div class="msg-meta">吴桐荟 · 处理中…</div><div class="msg-content"><span class="loading-dots">●●●</span></div>';
      chat.appendChild(loadingDiv);
      chat.scrollTop = chat.scrollHeight;

      try {
        const resp = await fetch('http://127.0.0.1:18789/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: 'desktop' }),
        });
        document.getElementById(loadingId)?.remove();

        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        append('assistant', data.content || '(无响应)');
      } catch (err) {
        document.getElementById(loadingId)?.remove();
        append('assistant', `❌ 调用失败：${err.message}\n\n请检查 ~/.wutonghui/logs/daemon.log`);
      }
    }

    function quickPrompt(t) {
      input.value = t;
      input.focus();
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
  </script>
</body>
</html>
